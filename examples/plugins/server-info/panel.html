<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
      section { min-width: 0; }
      .head { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; }
      .head .spacer { flex: 1; }
      .full { grid-column: 1 / 3; }
      pre { max-height: 220px; }
      .err { color: var(--err); }
    </style>
  </head>
  <body>
    <div class="head">
      <h2 id="os">…</h2>
      <span class="muted" id="uptime"></span>
      <span class="spacer"></span>
      <button id="refresh"></button>
    </div>
    <section><h4 id="disksTitle"></h4><pre id="disks"></pre></section>
    <section><h4 id="procTitle"></h4><pre id="procs"></pre></section>
    <div class="full err" id="error"></div>
    <script src="panel.js"></script>
  </body>
</html>
